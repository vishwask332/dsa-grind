function pform(id){const p=id?REG.profiles[id]:null;return `<h3>${id?'Edit Profile':'Create Profile'}</h3><input type="text" id="pn" maxlength="20" placeholder="Name" value="${p?esc(p.name):''}" style="margin-top:12px"><div class="sub" style="margin-top:8px">Choose avatar</div><div class="avg">${AV.map(a=>`<label class="av"><input type="radio" name="av" value="${a}" ${(p?p.avatar:AV[0])==a?'checked':''}><span>${a}</span></label>`).join('')}</div><div id="perr" class="sub" style="color:#ff6b81;min-height:18px"></div><button class="btn go" data-a="${id?'psave':'pcreate'}" data-id="${id||''}">${id?'SAVE':'CREATE PROFILE'}</button><button class="btn sm" data-a="close">Cancel</button>`}
REG=loadReg();
const selAv=()=>(document.querySelector('input[name=av]:checked')||{}).value;
function modal(h){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="card fade">'+h+'</div>';o.onclick=e=>{if(e.target==o||e.target.dataset.a=='close')o.remove()};document.body.appendChild(o);return o}
function confetti(){if(RM())return;const c=['#22e6ff','#a56bff','#3dff9a','#ffd24a','#ff8a3d'];for(let i=0;i<45;i++){const e=document.createElement('div');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%5];e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3400)}}
function complete(n){if(S.done[n]){go('day',String(Math.min(100,n+1)));return}if(!tasks(n).every(x=>S.tasks[x.id])){modal('<h3>Not yet 💪</h3><p class="sub">Tick every task first.</p><button class="btn" data-a="close">OK</button>');return}
 if(!S.done[n]){S.done[n]=dstr(now())}S.cur=firstOpen();
 if(!S.seen||(!S.seen.length&&S.badges.length))S.seen=S.badges.slice();const nu=unlocked().filter(b=>!S.seen.includes(b));S.seen=S.seen.concat(nu);S.badges=unlocked();ensureCert();save();render();const s=streak();if(doneN().length==100){hundred(nu);return}
 celebrate(n,nu,s)}
function onClick(e){const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,n=+t.dataset.n;
 if(a=='go'){e.preventDefault();document.querySelectorAll('.ov').forEach(o=>o.remove());go(t.dataset.v,t.dataset.n)}
 else if(a=='tick'){S.tasks[t.dataset.id]=t.checked;const dn=+t.dataset.id.split(':')[0];if(!t.checked&&S.done[dn])delete S.done[dn];S.cur=firstOpen();S.badges=unlocked();save();render()}
 else if(a=='addq'){const q=$('#cq').value.trim();if(!q)return;(S.custom[n]=S.custom[n]||[]).push({t:q,u:$('#cu').value.trim()});save();render()}
 else if(a=='delq'){e.preventDefault();e.stopPropagation();S.custom[n].splice(+t.dataset.i,1);Object.keys(S.tasks).filter(k=>k.startsWith(n+':c')).forEach(k=>delete S.tasks[k]);save();render()}
 else if(a=='complete')complete(n);
 else if(a=='exp')modal(`<h3>Export</h3><p class="sub">Includes ALL profiles. Copy this JSON and keep it safe.</p><textarea id="ex" readonly>${esc(JSON.stringify(exportAll()))}</textarea><button class="btn go" data-a="dl">⬇ Download file</button><button class="btn" data-a="copy">Copy</button><button class="btn sm" data-a="close">Close</button>`)
 else if(a=='copy'){const x=$('#ex');x.select();try{navigator.clipboard.writeText(x.value)}catch(_){document.execCommand('copy')}t.textContent='Copied ✓'}
 else if(a=='imp')modal(`<h3>Import</h3><p class="sub">Paste an exported backup. An all-profiles backup replaces ALL profiles (a safety copy is kept first).</p><input type="file" id="imf" accept=".json,application/json"><textarea id="im" placeholder="…or paste JSON here"></textarea><button class="btn go" data-a="doimp">Import</button><button class="btn sm" data-a="close">Cancel</button>`)
 else if(a=='doimp'){try{const j=JSON.parse($('#im').value);if(j&&j.profiles){if(!importAll(j))throw 0;closeOv();go('profiles')}else{if(!j.tasks||!j.done||!KEY)throw 0;S=Object.assign(fresh(),j);S.name=curName();S.cur=firstOpen();save();closeOv();render()}}catch(_){t.textContent='Invalid JSON ✗'}}
 else if(a=='reset')modal(`<h3>Are you sure?</h3><p class="sub">This will erase your 100-day progress, notes and achievements for this profile only.</p><div class="row"><button class="btn" data-a="close">Cancel</button><button class="btn" style="border-color:#ff4d6d;background:#ff4d6d33" data-a="doreset">Reset Everything</button></div>`)
 else if(a=='dl')save2(new Blob([JSON.stringify(exportAll(),null,1)],{type:'application/json'}),'dsa-grind-progress-'+dstr(now())+'.json')
 else if(a=='bk'){autoBackup(true);t.textContent='Backed up ✓'}
 else if(a=='rs'){let b=[];try{b=JSON.parse(localStorage.getItem(KEY+'-bk')||'[]')}catch(_){}modal('<h3>Restore backup</h3><p class="sub">Current progress is backed up first.</p>'+(b.map((x,i)=>`<button class="btn sm" data-a="dors" data-i="${i}">${new Date(x.t).toLocaleString()}</button>`).join('')||'<p class="sub">No backups yet.</p>')+'<button class="btn sm" data-a="close">Close</button>')}
 else if(a=='dors'){const b=JSON.parse(localStorage.getItem(KEY+'-bk')||'[]'),d=b[+t.dataset.i].d;autoBackup(true);S=Object.assign(fresh(),JSON.parse(d));S.name=curName();S.cur=firstOpen();save();document.querySelector('.ov').remove();render()}
 else if(a=='dlcert')dlCert()
 else if(a=='pick'){const id=t.dataset.id;if(!REG.profiles[id]||ENT)return;enter(id,view=='profiles')}
 else if(a=='skip')endIntro()
 else if(a=='vtog'){lsSet('dsa-grind-voice',voiceOn()?'off':'on');if(!voiceOn()){try{speechSynthesis.cancel()}catch(e){}}document.querySelectorAll('.vc,.vb').forEach(x=>x.textContent=voiceOn()?'🗣':'🤫');if(view=='settings')render()}
 else if(a=='snd'){lsSet('dsa-grind-sound',soundOn()?'off':'on');if(soundOn())play('pick');if(view=='settings'||view=='profiles')render();document.querySelectorAll('#intro .snd').forEach(x=>x.textContent=soundOn()?'🔊':'🔇')}
 else if(a=='wcont'){dismissWelcome();if(n)go('day','1')}
 else if(a=='ccont'){closeOv();go('day',String(n))}
 else if(a=='vcert'){closeOv();go('cert')}
 else if(a=='vach'){closeOv();go('ach')}
 else if(a=='pmenu'){closeOv();modal('<h3>Switch Profile</h3>'+REG.order.map(id=>`<button class="btn sm ${id===ACT?'go':''}" data-a="pick" data-id="${id}">${REG.profiles[id].avatar} ${esc(REG.profiles[id].name.toUpperCase())}${id===ACT?' ✓':''}</button>`).join('')+(REG.order.length<5?'<button class="btn sm" data-a="padd">＋ Add Profile</button>':'<div class="sub">5/5 profiles</div>')+'<button class="btn sm" data-a="pmanage">👥 Manage Profiles</button><button class="btn sm" data-a="pscreen">🏠 Profile screen</button><button class="btn sm" data-a="close">Close</button>')}
 else if(a=='pscreen'){closeOv();leaveProfile();go('profiles')}
 else if(a=='padd'){if(REG.order.length>=5)return;closeOv();modal(pform())}
 else if(a=='pcreate'){const r=createProfile($('#pn').value,selAv());if(r.err){$('#perr').textContent=r.err;return}closeOv();
  if(ACT){modal(`<h3>✓ Profile created</h3><p>${esc(REG.profiles[r.id].name)} starts fresh on Day 1.</p><button class="btn go" data-a="pick" data-id="${r.id}">Switch to ${esc(REG.profiles[r.id].name)}</button><button class="btn sm" data-a="close">Stay here</button>`)}else render()}
 else if(a=='pedit'){closeOv();modal(pform(t.dataset.id))}
 else if(a=='psave'){const e=editProfile(t.dataset.id,$('#pn').value,selAv());if(e){$('#perr').textContent=e;return}closeOv();render()}
 else if(a=='pmanage'){closeOv();modal('<h3>Manage Profiles</h3>'+REG.order.map(id=>`<div class="row" style="align-items:center;margin:10px 0"><div style="flex:2;text-align:left">${REG.profiles[id].avatar} <b>${esc(REG.profiles[id].name)}</b></div><button class="btn sm" style="margin:0" data-a="pedit" data-id="${id}">Edit</button><button class="btn sm" style="margin:0;border-color:#ff4d6d" data-a="pdel" data-id="${id}">Delete</button></div>`).join('')+'<button class="btn sm" data-a="close">Close</button>')}
 else if(a=='pdel'){const id=t.dataset.id;closeOv();modal(`<h3>Delete ${esc(REG.profiles[id].name)}?</h3><p>Delete this profile and all of its DSA progress?</p>${id=='p1'?'<p class="sub">This is your original profile. Type DELETE to confirm.</p><input type="text" id="pdc" placeholder="DELETE">':''}<div class="row"><button class="btn" data-a="close">CANCEL</button><button class="btn" style="border-color:#ff4d6d;background:#ff4d6d33" data-a="pdodel" data-id="${id}">DELETE</button></div>`)}
 else if(a=='pdodel'){const id=t.dataset.id;if(id=='p1'&&($('#pdc').value||'').trim()!=='DELETE'){t.textContent='Type DELETE first';return}
  if(!delProfile(id)){closeOv();modal('<h3>Keep at least one profile</h3><button class="btn" data-a="close">OK</button>');return}closeOv();if(!ACT)go('profiles');else render()}
 else if(a=='print')window.print()
 else if(a=='doreset'){autoBackup(true);S=fresh();S.name=curName();save();document.querySelector('.ov').remove();go('home')}}
function onInput(e){const t=e.target,n=t.dataset.n;
 if(t.dataset.f){S.notes[n]=S.notes[n]||{};if(t.dataset.f=='imp')S.notes[n].imp=t.checked;else S.notes[n][t.dataset.f]=t.value;save()}
 else if(t.id=='nm'){S.name=t.value.trim()||'Vishwas';save()}
 else if(t.id=='q'||t.id=='rq'){const k=t.id=='q'?'sq':'rq',p=t.selectionStart;S[k]=t.value;save();render();const i=$('#'+t.id);i.focus();i.setSelectionRange(p,p)}}
if(typeof document!=='undefined'&&document.addEventListener){document.addEventListener('keydown',e=>{if(INTRO&&(e.key==='Escape'||e.key==='Enter'||e.key===' '))endIntro()});document.addEventListener('pointerdown',()=>{if(soundOn())ac()},{passive:true});document.addEventListener('click',onClick);document.addEventListener('input',onInput);
 document.addEventListener('change',e=>{if(e.target.id=='imf'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#im').value=r.result};r.readAsText(f)}});
 (function(){const h=location.hash.slice(1),i=h.indexOf('/'),v=i<0?h:h.slice(0,i);let sa=null;try{sa=sessionStorage.getItem('dsa-active')}catch(e){}
  if(v=='verify'){view=v;arg=h.slice(i+1)}
  else if(sa&&REG.profiles[sa]){loadProfile(sa);view='home';if(V[v]&&v!='profiles'&&v!='verify'&&(v!='cert'||S.cert)){view=v;arg=i<0?null:h.slice(i+1)}}
  else view='profiles';
  render();intro();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})})()}
</script></body></html>
